# Release pipeline: minimal static ffmpeg + vidc + packaging per OS.
#
# First run MUST be manual (workflow_dispatch) — see PART F. Tagging v* builds
# the same artifacts and attaches them to the GitHub Release. Never tag from CI.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            goos: linux
            goarch: amd64
          - os: macos-15-intel
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: macos-14
            arch: arm64
            goos: darwin
            goarch: arm64
          - os: windows-2022
            arch: amd64
            goos: windows
            goarch: amd64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # --- 1. platform dependencies for the ffmpeg build ---
      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm meson ninja-build pkg-config xxd ffmpeg

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm meson ninja pkg-config ffmpeg vim

      - name: MSYS2 setup (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            make
            nasm
            mingw-w64-x86_64-meson
            ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-ffmpeg
            procps-ng
            vim
            git
            curl

      # --- 2. minimal static ffmpeg (the committed recipe) ---
      - name: Build ffmpeg (posix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p .ffbuild && cd .ffbuild
          sh ../build/ffmpeg-build.sh

      - name: Build ffmpeg (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p .ffbuild && cd .ffbuild
          export LDFLAGS="-static"
          bash ../build/ffmpeg-build.sh

      - name: Dump configure log on failure (posix)
        if: failure() && runner.os != 'Windows'
        run: |
          LOG=$(ls -d .ffbuild/ffmpeg-*/ffbuild/config.log 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then grep -B3 -A18 "ERROR:" "$LOG" | head -60; fi

      - name: Dump configure log on failure (windows)
        if: failure() && runner.os == 'Windows'
        shell: powershell
        run: |
          $log = Get-ChildItem .ffbuild/ffmpeg-*/ffbuild/config.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Select-String -Path $log.FullName -Pattern 'ERROR:' -Context 3,18 | Select-Object -First 60 }

      # --- 3. the A2 usability assertions: the artifact must actually work ---
      - name: Assert ffmpeg features (posix)
        if: runner.os != 'Windows'
        run: |
          FF=.ffbuild/dist-ffmpeg/bin/ffmpeg
          $FF -hide_banner -filters  | grep -q libvmaf         || { echo "libvmaf filter MISSING"; exit 1; }
          $FF -hide_banner -encoders | grep -q libx264         || { echo "libx264 MISSING"; exit 1; }
          $FF -hide_banner -encoders | grep -q wrapped_avframe || { echo "wrapped_avframe MISSING"; exit 1; }
          strings $FF > /tmp/ff.strings
          grep -q vmaf_v0.6.1 /tmp/ff.strings || { echo "built-in VMAF model MISSING (was xxd present for the libvmaf build?)"; exit 1; }

      - name: Assert ffmpeg features (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          FF=.ffbuild/dist-ffmpeg/bin/ffmpeg.exe
          $FF -hide_banner -filters  | grep -q libvmaf         || { echo "libvmaf filter MISSING"; exit 1; }
          $FF -hide_banner -encoders | grep -q libx264         || { echo "libx264 MISSING"; exit 1; }
          $FF -hide_banner -encoders | grep -q wrapped_avframe || { echo "wrapped_avframe MISSING"; exit 1; }
          strings $FF > /tmp/ff.strings
          grep -q vmaf_v0.6.1 /tmp/ff.strings || { echo "built-in VMAF model MISSING (was xxd present for the libvmaf build?)"; exit 1; }
          if $FF -version 2>/dev/null | grep -qi "libwinpthread\|libstdc++-6"; then :; fi
          ldd $FF | grep -Ei "winpthread|libstdc\+\+-6|libgcc_s" && { echo "unexpected DLL dependency"; exit 1; } || true

      - name: Assert no non-system dylibs (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L .ffbuild/dist-ffmpeg/bin/ffmpeg
          otool -L .ffbuild/dist-ffmpeg/bin/ffmpeg | grep -vE "/usr/lib|/System|@rpath|:$|dist-ffmpeg" && { echo "unexpected dylib dependency"; exit 1; } || true

      # --- 4. vidc itself, statically, version-stamped ---
      - name: Vet, test, build (posix)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...
          mkdir -p stage/bin
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-X main.version=$VERSION" -o stage/bin/vidc .
          cp .ffbuild/dist-ffmpeg/bin/ffmpeg .ffbuild/dist-ffmpeg/bin/ffprobe stage/bin/

      - name: Vet, test, build (windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...
          New-Item -ItemType Directory -Force stage/bin | Out-Null
          $env:GOOS = "${{ matrix.goos }}"; $env:GOARCH = "${{ matrix.goarch }}"
          go build -ldflags "-X main.version=$env:VERSION" -o stage/bin/vidc.exe .
          Copy-Item .ffbuild/dist-ffmpeg/bin/ffmpeg.exe, .ffbuild/dist-ffmpeg/bin/ffprobe.exe stage/bin/

      # --- 5. real encode with the BUNDLED ffmpeg (the point of the workflow) ---
      - name: Real encode test (posix)
        if: runner.os != 'Windows'
        run: |
          cd stage/bin
          ffmpeg -f lavfi -i testsrc2=d=4:s=640x360:r=30 -f lavfi -i sine=f=440:d=4 \
                 -c:v libx264 -crf 20 -c:a aac -shortest test.mp4
          ./vidc -q good -y test.mp4
          test -s test.min.mp4
          ./ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 test.min.mp4 | grep -q h264
          ./vidc -q good -y test.mp4 | grep -q "VMAF [0-9]" || { echo "VMAF did not run"; exit 1; }
          ./vidc --size 300k -y test.mp4
          rm -f test.mp4 test.min*.mp4

      - name: Real encode test (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd stage/bin
          ffmpeg -f lavfi -i testsrc2=d=4:s=640x360:r=30 -f lavfi -i sine=f=440:d=4 \
                 -c:v libx264 -crf 20 -c:a aac -shortest test.mp4
          ./vidc -q good -y test.mp4
          test -s test.min.mp4
          ./ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 test.min.mp4 | grep -q h264
          ./vidc -q good -y test.mp4 | grep -q "VMAF [0-9]" || { echo "VMAF did not run"; exit 1; }
          ./vidc --size 300k -y test.mp4
          rm -f test.mp4 test.min*.mp4

      # --- 6a. package: Linux AppImage ---
      - name: Package AppImage (linux)
        if: runner.os == 'Linux'
        run: |
          STAGE=vidc.AppDir
          rm -rf $STAGE && mkdir -p $STAGE/usr/bin $STAGE/usr/share/licenses/ffmpeg
          cp stage/bin/vidc stage/bin/ffmpeg stage/bin/ffprobe $STAGE/usr/bin/
          cp packaging/appimage/AppRun packaging/appimage/vidc.desktop $STAGE/
          cp packaging/appimage/vidc.png $STAGE/
          cp third_party/ffmpeg/COPYING.GPL $STAGE/usr/share/licenses/ffmpeg/
          chmod +x $STAGE/AppRun $STAGE/usr/bin/vidc
          curl -fsSLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          ARCH=x86_64 ./squashfs-root/AppRun $STAGE
          AI=$(ls -t vidc-*.AppImage | head -1)
          echo "appimagetool produced: $AI"
          mv "$AI" "vidc-$VERSION-linux-amd64.AppImage"

      # --- 6b. package: macOS zip (unsigned: plain zip plus instructions) ---
      - name: Package zip (macOS)
        if: runner.os == 'macOS'
        run: |
          STAGE=vidc-${{ matrix.arch }}
          rm -rf $STAGE && mkdir $STAGE
          cp stage/bin/vidc stage/bin/ffmpeg stage/bin/ffprobe $STAGE/
          cp third_party/ffmpeg/COPYING.GPL THIRDPARTY.md $STAGE/
          cat > $STAGE/README.txt <<'EOF'
          vidc for macOS (unsigned build)
          ===============================
          Contents: vidc, ffmpeg, ffprobe (all in this folder).
          ffmpeg is bundled: no separate install needed.
          This build is NOT code-signed. On first launch, right-click (or
          Control-click) vidc in Finder and choose Open, then confirm.
          Afterwards it opens normally.
          Usage: drag files onto a terminal command, e.g.
            ./vidc -q good -y mymovie.mp4
          Run with no arguments for the app window (needs a display).
          Third-party licenses: see THIRDPARTY.md.
          EOF
          ditto -c -k --sequesterRsrc $STAGE "vidc-$VERSION-darwin-${{ matrix.arch }}.zip"

      # --- 6c. package: Windows zip + GUI shortcut ---
      - name: Package zip (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $STAGE = "vidc-package"
          if (Test-Path $STAGE) { Remove-Item -Recurse -Force $STAGE }
          New-Item -ItemType Directory $STAGE | Out-Null
          Copy-Item stage/bin/vidc.exe, stage/bin/ffmpeg.exe, stage/bin/ffprobe.exe, third_party/ffmpeg/COPYING.GPL, THIRDPARTY.md $STAGE/
          @'
          vidc for Windows
          =================
          Contents: vidc.exe, ffmpeg.exe, ffprobe.exe (all in this folder).
          ffmpeg is bundled: no separate install needed.
          Double-click "vidc (GUI)" for the app window. Running vidc.exe
          directly with no arguments prints usage instead (a bare double-click
          cannot open the window).
          Usage: vidc.exe -q good -y mymovie.mp4
          Third-party licenses: see THIRDPARTY.md.
          '@ | Out-File -Encoding ascii $STAGE/README.txt
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut("$PWD/$STAGE/vidc (GUI).lnk")
          $s.TargetPath = "$PWD/$STAGE/vidc.exe"; $s.Arguments = "--gui"; $s.WorkingDirectory = "$PWD/$STAGE"; $s.Save()
          Compress-Archive -Path $STAGE/* -DestinationPath "vidc-$env:VERSION-windows-amd64.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: vidc-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.arch }}
          path: |
            vidc-*.AppImage
            vidc-*.zip
          if-no-files-found: error

  release:
    name: attach to GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
