<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vidc</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 20px;
    background: #1e1e22; color: #d7d7dc;
    font-family: -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    font-size: 14px;
  }
  h1 { font-size: 20px; margin: 0 0 12px; font-weight: 600; }
  #drop {
    border: 2px dashed #55555e; border-radius: 8px;
    padding: 26px 12px; text-align: center; cursor: pointer;
    margin-bottom: 14px;
  }
  #drop:hover { border-color: #888892; background: #242429; }
  #drop .big { font-size: 15px; }
  #drop .sub { font-size: 12px; color: #9a9aa2; margin-top: 4px; }
  #dropmsg { font-size: 12px; color: #e0b34e; margin-top: 6px; min-height: 16px; }
  #files { margin-bottom: 14px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 4px; border-bottom: 1px solid #2c2c31;
  }
  .row .name { width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { flex: 1; height: 12px; background: #333338; border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: #4f9cf0; }
  .row.done .bar > div { background: #4caf6d; }
  .row.error .bar > div { background: #c0504d; }
  .pct { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .status { width: 64px; color: #9a9aa2; }
  .result { flex: 2; font-size: 13px; color: #b9e0b9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .warn { color: #e0b34e; font-size: 12px; }
  .x {
    border: none; background: none; color: #9a9aa2; cursor: pointer;
    font-size: 15px; padding: 2px 6px;
  }
  .x:hover { color: #fff; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 14px; }
  .controls label { display: inline-flex; align-items: center; gap: 5px; }
  .controls input[type="text"] {
    background: #2a2a30; color: #d7d7dc; border: 1px solid #44444c;
    border-radius: 4px; padding: 4px 8px; width: 90px;
  }
  .controls input[type="text"]:disabled { opacity: 0.4; }
  .controls input[type="text"].wide { width: 170px; }
  .buttons { display: flex; gap: 10px; margin-bottom: 12px; }
  button.action {
    background: #2f6fb5; color: #fff; border: none; border-radius: 5px;
    padding: 8px 22px; font-size: 14px; cursor: pointer;
  }
  button.action:hover:not(:disabled) { background: #3a80c9; }
  button.action:disabled { opacity: 0.45; cursor: default; }
  button.action.secondary { background: #3a3a41; }
  button.action.secondary:hover:not(:disabled) { background: #4a4a53; }
  #summary { font-size: 14px; min-height: 20px; }
  #empty { color: #9a9aa2; padding: 4px; }
</style>
</head>
<body>
<h1>vidc</h1>

<div id="drop" title="Add files">
  <div class="big">[ Add files ]</div>
  <div class="sub">drag &amp; drop: not yet supported — click to browse instead</div>
  <div id="dropmsg"></div>
</div>

<div id="files"><div id="empty">No files yet — click above to add videos.</div></div>

<div class="controls">
  <span>Quality</span>
  <label><input type="radio" name="preset" value="fast"> fast</label>
  <label><input type="radio" name="preset" value="good" checked> good</label>
  <label><input type="radio" name="preset" value="best"> best</label>
  <span>or size <input type="text" id="size" placeholder="8M"></span>
  <span>output dir <input type="text" class="wide" id="outdir" placeholder="beside source"></span>
  <button class="action secondary" id="browsedir" type="button" title="Choose output directory">..</button>
  <label><input type="checkbox" id="verify" checked> verify VMAF</label>
</div>

<div class="buttons">
  <button class="action" id="start" type="button" disabled>Start</button>
  <button class="action secondary" id="cancel" type="button">Cancel</button>
  <button class="action secondary" id="openfolder" type="button">Open folder</button>
</div>

<div id="summary"></div>

<script>
'use strict';
var hasBackend = (typeof window.vidc_get_state === 'function');
var state = { files: [], settings: { preset: 'good', size: '', outdir: '', verify: true }, running: false, summary: '' };

function el(sel) { return document.querySelector(sel); }

function txt(parent, s) { parent.appendChild(document.createTextNode(String(s))); return parent; }

function span(cls, s) {
  var e = document.createElement('span');
  e.className = cls;
  txt(e, s);
  return e;
}

function render() {
  var box = el('#files');
  while (box.firstChild) { box.removeChild(box.firstChild); }
  if (!state.files.length) {
    var empty = document.createElement('div');
    empty.id = 'empty';
    txt(empty, 'No files yet — click above to add videos.');
    box.appendChild(empty);
  }
  state.files.forEach(function(f) {
    var row = document.createElement('div');
    var cls = 'row';
    if (f.status === 'done') { cls += ' done'; }
    if (f.status === 'error') { cls += ' error'; }
    row.className = cls;
    var nm = span('name', f.name);
    nm.title = f.name;
    row.appendChild(nm);
    if (f.status === 'done') {
      var res = span('result', (f.result || '') + (f.vmaf ? ' VMAF ' + f.vmaf : ''));
      row.appendChild(res);
    } else if (f.status === 'error') {
      var er = span('result', f.error || 'failed');
      er.style.color = '#e08a87';
      row.appendChild(er);
    } else if (f.status === 'cancelled') {
      var cx = span('result', 'cancelled');
      cx.style.color = '#9a9aa2';
      row.appendChild(cx);
    } else {
      var bar = document.createElement('span');
      bar.className = 'bar';
      var fill = document.createElement('div');
      fill.style.width = f.percent.toFixed(1) + '%';
      bar.appendChild(fill);
      row.appendChild(bar);
      row.appendChild(span('pct', f.percent.toFixed(0) + '%'));
    }
    row.appendChild(span('status', f.status));
    if (f.warn) {
      var w = span('warn', 'warn');
      w.title = f.warn;
      row.appendChild(w);
    }
    var btn = document.createElement('button');
    btn.className = 'x';
    btn.title = 'Remove';
    btn.setAttribute('data-id', f.id);
    txt(btn, 'x');
    btn.addEventListener('click', function() {
      if (!hasBackend) { return; }
      window.vidc_remove_file(btn.getAttribute('data-id')).then(refresh, showErr);
    });
    row.appendChild(btn);
    box.appendChild(row);
  });
  el('#start').disabled = state.running || !state.files.length;
  el('#summary').textContent = state.summary || '';
  syncSettings();
}

function syncSettings() {
  var s = state.settings || {};
  var radios = document.querySelectorAll('input[name="preset"]');
  Array.prototype.forEach.call(radios, function(r) {
    r.checked = (r.value === (s.preset || 'good'));
    r.disabled = !!(s.size);
  });
  if (document.activeElement !== el('size')) { el('size').value = s.size || ''; }
  if (document.activeElement !== el('outdir')) { el('outdir').value = s.outdir || ''; }
  el('verify').checked = s.verify !== false;
}

function showErr(e) {
  el('summary').textContent = 'Error: ' + (e && e.message ? e.message : e);
}

function refresh() {
  if (!hasBackend) { return Promise.resolve(); }
  return window.vidc_get_state().then(function(s) { state = s; render(); }, showErr);
}

function pushSettings() {
  if (!hasBackend) { return; }
  var preset = 'good';
  var radios = document.querySelectorAll('input[name="preset"]');
  Array.prototype.forEach.call(radios, function(r) { if (r.checked) { preset = r.value; } });
  var s = {
    preset: preset,
    size: el('size').value.trim(),
    outdir: el('outdir').value.trim(),
    verify: el('verify').checked
  };
  state.settings = s;
  syncSettings();
  window.vidc_update_settings(s).catch(showErr);
}

el('drop').addEventListener('click', function() {
  if (!hasBackend) { return; }
  el('dropmsg').textContent = '';
  window.vidc_add_files().then(function() { refresh(); }, showErr);
});
el('drop').addEventListener('dragover', function(e) {
  e.preventDefault();
  el('dropmsg').textContent = 'Drag-and-drop is not yet supported — click to browse instead.';
});
el('drop').addEventListener('drop', function(e) {
  e.preventDefault();
  el('dropmsg').textContent = 'Drag-and-drop is not yet supported — click [ Add files ] to browse instead.';
});

el('start').addEventListener('click', function() {
  if (!hasBackend) { return; }
  pushSettings();
  var radios = document.querySelectorAll('input[name="preset"]');
  var preset = 'good';
  Array.prototype.forEach.call(radios, function(r) { if (r.checked) { preset = r.value; } });
  window.vidc_start({
    preset: preset,
    size: el('size').value.trim(),
    outdir: el('outdir').value.trim(),
    verify: el('verify').checked
  }).then(refresh, showErr);
});

el('cancel').addEventListener('click', function() {
  if (!hasBackend) { return; }
  window.vidc_cancel().then(function(m) {
    if (m === 'idle') { el('summary').textContent = 'Nothing running.'; }
    refresh();
  }, showErr);
});

el('openfolder').addEventListener('click', function() {
  if (!hasBackend) { return; }
  window.vidc_open_folder().catch(showErr);
});

el('browsedir').addEventListener('click', function() {
  if (!hasBackend) { return; }
  window.vidc_choose_out_dir().then(function(d) {
    if (d) { el('outdir').value = d; pushSettings(); }
  }, showErr);
});

Array.prototype.forEach.call(document.querySelectorAll('input[name="preset"]'), function(r) {
  r.addEventListener('change', function() { el('size').value = ''; pushSettings(); });
});
el('size').addEventListener('input', function() {
  var has = !!el('size').value.trim();
  var radios = document.querySelectorAll('input[name="preset"]');
  Array.prototype.forEach.call(radios, function(r) { r.disabled = has; });
});
el('size').addEventListener('change', pushSettings);
el('outdir').addEventListener('change', pushSettings);
el('verify').addEventListener('change', pushSettings);

var resizeT = null;
window.addEventListener('resize', function() {
  if (!hasBackend) { return; }
  if (resizeT) { return; }
  resizeT = setTimeout(function() {
    resizeT = null;
    window.vidc_note_window_size(window.innerWidth, window.innerHeight).catch(function() {});
  }, 500);
});

if (window.glaze && window.glaze.events) {
  window.glaze.events.on('vidc:files', function(files) { state.files = files; render(); });
  window.glaze.events.on('vidc:progress', function(p) {
    for (var i = 0; i < state.files.length; i++) {
      if (state.files[i].id === p.id) {
        state.files[i].percent = p.percent;
        state.files[i].speed = p.speed;
        state.files[i].eta = p.eta;
        if (state.files[i].status === 'queued') { state.files[i].status = 'running'; }
        break;
      }
    }
    render();
  });
  window.glaze.events.on('vidc:result', function(r) {
    for (var i = 0; i < state.files.length; i++) {
      if (state.files[i].id === r.id) {
        state.files[i].status = r.status;
        state.files[i].result = r.result || '';
        state.files[i].vmaf = r.vmaf || '';
        state.files[i].warn = r.warn || '';
        state.files[i].error = r.error || '';
        state.files[i].percent = (r.status === 'done') ? 100 : state.files[i].percent;
        break;
      }
    }
    render();
  });
  window.glaze.events.on('vidc:done', function(d) {
    state.summary = d.summary || '';
    state.running = false;
    refresh();
  });
}

refresh();
</script>
</body>
</html>
